name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # macOS and Windows are included alongside Ubuntu to catch cross-platform
    # regressions before they reach users (resolves Issue #9).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and dev dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Build distribution from source
        run: python -m build

      - name: Verify reproducible build (SOURCE_DATE_EPOCH)
        # Use bash explicitly so that bash-specific syntax ($RUNNER_TEMP, sha256sum,
        # /dev/null, /tmp/) works identically on Ubuntu, macOS, and Windows
        # (Git Bash is available on all GitHub-hosted runners).
        shell: bash
        run: |
          # Build into $RUNNER_TEMP (outside the workspace) so the sdist never
          # captures build output directories, and pin SOURCE_DATE_EPOCH.
          SOURCE_DATE_EPOCH=1700000000 python -m build --sdist --wheel --outdir "$RUNNER_TEMP/dist-a" > /dev/null
          SOURCE_DATE_EPOCH=1700000000 python -m build --sdist --wheel --outdir "$RUNNER_TEMP/dist-b" > /dev/null
          (cd "$RUNNER_TEMP/dist-a" && sha256sum *) | cut -d' ' -f1 > /tmp/sha-a
          (cd "$RUNNER_TEMP/dist-b" && sha256sum *) | cut -d' ' -f1 > /tmp/sha-b
          diff /tmp/sha-a /tmp/sha-b && echo "Build is reproducible"

      - name: Verify built wheel in clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv-wheel"
          if [ -d "$RUNNER_TEMP/venv-wheel/Scripts" ]; then
            source "$RUNNER_TEMP/venv-wheel/Scripts/activate"
          else
            source "$RUNNER_TEMP/venv-wheel/bin/activate"
          fi
          pip install dist/*.whl
          (cd "$RUNNER_TEMP" && python -c "import gun101; assert 'site-packages' in gun101.__file__, f'Not site-packages: {gun101.__file__}'")
          mkdir -p "$RUNNER_TEMP/smoke-test-wheel"
          (
            cd "$RUNNER_TEMP/smoke-test-wheel"
            gun101 --help
            gun101 info
            gun101 generate-keyfile "test.key"
            gun101 keyfile-fingerprint "test.key"
            echo "Wheel verification payload" > "input.txt"
            GUN101_PASSWORD="ValidTestPass123!" gun101 encrypt "input.txt" --keyfile "test.key" --output "input.txt.gun101"
            GUN101_PASSWORD="ValidTestPass123!" gun101 decrypt "input.txt.gun101" --keyfile "test.key" --output "decrypted.txt"
            diff "input.txt" "decrypted.txt"
          )

      - name: Verify built sdist in clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv-sdist"
          if [ -d "$RUNNER_TEMP/venv-sdist/Scripts" ]; then
            source "$RUNNER_TEMP/venv-sdist/Scripts/activate"
          else
            source "$RUNNER_TEMP/venv-sdist/bin/activate"
          fi
          pip install dist/*.tar.gz
          (cd "$RUNNER_TEMP" && python -c "import gun101; assert 'site-packages' in gun101.__file__, f'Not site-packages: {gun101.__file__}'")
          mkdir -p "$RUNNER_TEMP/smoke-test-sdist"
          (
            cd "$RUNNER_TEMP/smoke-test-sdist"
            gun101 --help
            gun101 info
            gun101 generate-keyfile "test.key"
            gun101 keyfile-fingerprint "test.key"
            echo "Sdist verification payload" > "input.txt"
            GUN101_PASSWORD="ValidTestPass123!" gun101 encrypt "input.txt" --keyfile "test.key" --output "input.txt.gun101"
            GUN101_PASSWORD="ValidTestPass123!" gun101 decrypt "input.txt.gun101" --keyfile "test.key" --output "decrypted.txt"
            diff "input.txt" "decrypted.txt"
          )

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Static analysis (bandit)
        run: python -m bandit -r src -q

      - name: Dependency vulnerability audit (pip-audit)
        run: python -m pip_audit -r requirements.lock

      - name: Run tests (with coverage gate)
        run: python -X dev -m pytest tests/ -v